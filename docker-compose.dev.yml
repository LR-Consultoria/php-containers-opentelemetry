# Local Compose file used to exercise the built images.
# Build the image first, e.g.: make build VERSION=8.4 VARIANT=frankenphp
# Then: docker compose -f docker-compose.dev.yml --profile frankenphp up -d

services:
  # Test PHP FrankenPHP
  php-frankenphp-test:
    image: ghcr.io/lr-consultoria/php-frankenphp:8.3-alpine
    container_name: test-php-frankenphp
    working_dir: /var/www
    ports:
      - "8090:80"
    volumes:
      - ./test-app:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    networks:
      - test-network
    profiles:
      - frankenphp

  # Database for testing
  test-database:
    image: mysql:8.0
    container_name: test-database
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    volumes:
      - test_db_data:/var/lib/mysql
    networks:
      - test-network
    profiles:
      - database

  # Redis for testing
  test-redis:
    image: redis:alpine
    container_name: test-redis
    volumes:
      - test_redis_data:/data
    networks:
      - test-network
    profiles:
      - redis

volumes:
  test_db_data:
  test_redis_data:

networks:
  test-network:
    driver: bridge
