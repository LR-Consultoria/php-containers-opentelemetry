name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly rebuild (Sundays, 02:00 UTC) to pick up Alpine security patches.
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-matrix:
    name: build ${{ matrix.variant }} ${{ matrix.php-version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        variant: ['frankenphp']
        arch: ['amd64', 'arm64']
        include:
          # Native runners per architecture: no QEMU emulation for arm64.
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set image name
      id: image-name
      run: |
        # Convert repository owner to lowercase for Docker compatibility
        REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "repo_owner=${REPO_OWNER_LOWER}" >> "$GITHUB_OUTPUT"
        echo "name=php-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.repo_owner }}/${{ steps.image-name.outputs.name }}
        # Every tag is architecture-scoped here; the create-manifests job
        # combines the per-arch tags into the final multi-arch tags.
        tags: |
          type=raw,value=${{ matrix.php-version }}-alpine-${{ matrix.arch }}
          type=raw,value=latest-${{ matrix.arch }},enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.variant }}/Dockerfile
        platforms: ${{ matrix.platform }}
        build-args: |
          PHP_VERSION=${{ matrix.php-version }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.php-version }}-${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.php-version }}-${{ matrix.arch }},mode=max

  create-manifests:
    name: manifest ${{ matrix.variant }} ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: [build-matrix]
    # Run even if one architecture failed, then skip only the affected versions.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        variant: ['frankenphp']

    permissions:
      contents: read
      packages: write

    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Set image name
      id: image-name
      run: |
        REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "repo_owner=${REPO_OWNER_LOWER}" >> "$GITHUB_OUTPUT"
        echo "name=php-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

    - name: Create and push multi-arch manifests
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.repo_owner }}/${{ steps.image-name.outputs.name }}
        VERSION: ${{ matrix.php-version }}
      run: |
        set -euo pipefail

        AMD64="${IMAGE}:${VERSION}-alpine-amd64"
        ARM64="${IMAGE}:${VERSION}-alpine-arm64"

        missing=0
        for ref in "$AMD64" "$ARM64"; do
          if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::warning::Missing arch image ${ref}, skipping manifests for PHP ${VERSION}"
            missing=1
          fi
        done
        [ "$missing" = "0" ] || exit 0

        # Multi-arch tag with and without the "-alpine" suffix.
        docker buildx imagetools create -t "${IMAGE}:${VERSION}-alpine" "$AMD64" "$ARM64"
        docker buildx imagetools create -t "${IMAGE}:${VERSION}" "$AMD64" "$ARM64"

        # "latest" tracks the current recommended version, only on main.
        if [ "$VERSION" = "8.4" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
          docker buildx imagetools create -t "${IMAGE}:latest" "$AMD64" "$ARM64"
        fi

  security-scan:
    name: trivy ${{ matrix.variant }} ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: [build-matrix]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        variant: ['frankenphp']

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
    - name: Set image reference
      id: image
      run: |
        REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "ref=${REGISTRY}/${REPO_OWNER_LOWER}/php-${{ matrix.variant }}:${{ matrix.php-version }}-alpine-amd64" >> "$GITHUB_OUTPUT"

    - name: Run Trivy (SARIF report)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.ref }}
        format: 'sarif'
        output: 'trivy-${{ matrix.php-version }}.sarif'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-${{ matrix.php-version }}.sarif'

    - name: Fail on unfixed HIGH/CRITICAL
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.ref }}
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

  smoke-test:
    name: smoke ${{ matrix.variant }} ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: [create-manifests]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        variant: ['frankenphp']

    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Make scripts executable
      run: chmod +x scripts/*.sh

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Smoke test published image
      env:
        REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
      run: |
        # The registry owner must be lowercase; normalise it here too.
        REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
        export REGISTRY
        # Ensure scripts/test.sh can execute even if the checkout lost the bit.
        chmod +x scripts/test.sh
        ./scripts/test.sh ${{ matrix.php-version }} ${{ matrix.variant }} alpine
