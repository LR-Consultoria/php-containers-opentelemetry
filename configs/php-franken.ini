; FrankenPHP-optimized PHP configuration for Laravel applications

; Error handling and logging
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance settings optimized for FrankenPHP
memory_limit = 512M
max_execution_time = 30
max_input_time = 60
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20

; Session settings
session.save_handler = files
session.save_path = /tmp
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"

; Security hardening for CVE-2026-109618 and CVE-2026-109619 (PHP 8.5.12 /
; 8.4.27 / 8.3.36 / 8.2.35, released 2026-10-21). Both are unauthenticated RCEs
; where a request leaves stale/corrupted state that a later request on the same
; worker can reuse; the patch is the only complete fix, these are the PHP team's
; recommended defence in depth.
;
; The upload progress handler is the known vector of CVE-2026-109619, so keep it
; off. It only exists for the `PHP_SESSION_UPLOAD_PROGRESS` field, which no
; consumer uses. `fatal_error_backtraces` exists on PHP >= 8.5 only and is
; silently ignored by older versions.
;
; Note: both are per-worker settings read at startup, so consumers must restart
; their workers to pick them up. `ini_set()` and `.user.ini` are too late.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; Security settings
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; OPcache settings optimized for FrankenPHP
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.preload_user = www-data

; Realpath cache
realpath_cache_size = 8M
realpath_cache_ttl = 3600

; Date settings
date.timezone = UTC

; OpenTelemetry: the extension is enabled by install-php-extensions
; (docker-php-ext-enable). Declaring it again here causes
; "Module already loaded" warnings.
